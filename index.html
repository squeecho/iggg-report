<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<script src="https://www.igggstudio.com/sso-gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이견공간 공사보고 자동화 — v2</title>

<!-- Fonts -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* =========================================================
   IGGG Design System v1.0 — embedded
   ========================================================= */

/* ---- Tokens ---- */
:root {
  /* Type scale */
  --fz-display-xl: clamp(3rem, 7vw, 5rem);
  --fz-display-l:  clamp(2rem, 5vw, 3rem);
  --fz-display-m:  1.5rem;
  --fz-body:       0.9375rem;
  --fz-mono-l:     0.8125rem;
  --fz-mono-m:     0.6875rem;
  --fz-mono-s:     0.625rem;

  /* Letter spacing */
  --ls-display:    -0.02em;
  --ls-mono:       0.08em;
  --ls-mono-wide:  0.18em;

  /* Lines & radii */
  --line-1: 1px;
  --radius-cap: 999px;
  --radius-md: 4px;

  /* Spacing */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* Motion */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 120ms;
  --dur-base: 200ms;

  /* Fonts */
  --ff-display: "Inter", "Pretendard Variable", system-ui, sans-serif;
  --ff-mono:    "JetBrains Mono", ui-monospace, monospace;
  --ff-body:    "Pretendard Variable", "Inter", system-ui, sans-serif;
}

/* Dark (default) */
:root[data-theme="dark"] {
  --bg:        #0a0a0a;
  --bg-elev:   #141414;
  --bg-input:  #2d2d2d;
  --bg-input-focus: #383838;
  --fg:        #f4f2ed;
  --fg-mute:   rgba(244, 242, 237, 0.6);
  --fg-faint:  rgba(244, 242, 237, 0.4);
  --line:      rgba(244, 242, 237, 0.55);
  --line-soft: rgba(244, 242, 237, 0.35);
  --accent:    #f4f2ed;
  --accent-fg: #0a0a0a;
  --danger:    #ff6b5e;
  --grain-opacity: 0.08;
  --logo-filter: invert(1) brightness(1.1);
}

/* Light */
:root[data-theme="light"] {
  --bg:        #f4f2ed;
  --bg-elev:   #ebe8e1;
  --bg-input:  #ffffff;
  --bg-input-focus: #ffffff;
  --fg:        #0a0a0a;
  --fg-mute:   rgba(10, 10, 10, 0.62);
  --fg-faint:  rgba(10, 10, 10, 0.32);
  --line:      rgba(10, 10, 10, 0.55);
  --line-soft: rgba(10, 10, 10, 0.16);
  --accent:    #0a0a0a;
  --accent-fg: #f4f2ed;
  --danger:    #c8302a;
  --grain-opacity: 0.04;
  --logo-filter: none;
}

/* ---- Reset ---- */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--ff-body);
  background: var(--bg);
  color: var(--fg);
  font-size: var(--fz-body);
  padding-bottom: 80px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Grain overlay */
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  opacity: var(--grain-opacity);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode: overlay;
}
body > * { position: relative; z-index: 2; }

/* ---- Type classes ---- */
.display-xl { font-family: var(--ff-display); font-weight: 900; letter-spacing: var(--ls-display); line-height: 0.95; font-size: var(--fz-display-xl); }
.display-l  { font-family: var(--ff-display); font-weight: 900; letter-spacing: var(--ls-display); line-height: 1.0;  font-size: var(--fz-display-l); }
.display-m  { font-family: var(--ff-display); font-weight: 900; line-height: 1.05; font-size: var(--fz-display-m); }

.mono-l { font-family: var(--ff-mono); font-weight: 500; letter-spacing: var(--ls-mono);      font-size: var(--fz-mono-l); text-transform: uppercase; }
.mono-m { font-family: var(--ff-mono); font-weight: 400; letter-spacing: var(--ls-mono);      font-size: var(--fz-mono-m); }
.mono-s { font-family: var(--ff-mono); font-weight: 400; letter-spacing: var(--ls-mono);      font-size: var(--fz-mono-s); color: var(--fg-mute); }
.label-cat { font-family: var(--ff-mono); font-weight: 500; letter-spacing: var(--ls-mono-wide); font-size: var(--fz-mono-m); text-transform: uppercase; }

/* ---- Layout ---- */
.wrap {
  max-width: 576px;
  margin: 0 auto;
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-6);
}

/* ---- Hero ---- */
.hero {
  padding: var(--sp-8) 0 var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  border-bottom: var(--line-1) dashed var(--line-soft);
  margin-bottom: var(--sp-2);
}
.hero__title {
  font-family: var(--ff-display);
  font-weight: 900;
  font-size: var(--fz-display-l);
  letter-spacing: var(--ls-display);
  line-height: 1;
  margin-top: var(--sp-2);
}
.hero__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  align-items: baseline;
}
.hero__meta span {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-s);
  letter-spacing: var(--ls-mono);
  color: var(--fg-faint);
  text-transform: uppercase;
}

/* ---- Theme toggle ---- */
.theme-toggle {
  position: fixed;
  top: var(--sp-3);
  right: var(--sp-3);
  z-index: 100;
  background: var(--bg);
  border: var(--line-1) solid var(--line);
  border-radius: var(--radius-cap);
  padding: var(--sp-1) var(--sp-3);
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-m);
  letter-spacing: var(--ls-mono);
  color: var(--fg);
  cursor: pointer;
  text-transform: uppercase;
}
.theme-toggle:hover { background: var(--bg-elev); }

/* ---- Card ---- */
.card {
  background: var(--bg-elev);
  border: var(--line-1) solid var(--line-soft);
  border-radius: var(--radius-md);
  padding: var(--sp-6);
}
.card-content { display: flex; flex-direction: column; gap: var(--sp-6); }

/* ---- Label — 한글 친화 (uppercase 제거) ---- */
.label {
  display: block;
  font-family: var(--ff-body);
  font-weight: 600;
  font-size: var(--fz-body);
  color: var(--fg);
  margin-bottom: var(--sp-2);
}
.label__sub {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-s);
  letter-spacing: var(--ls-mono);
  color: var(--fg-faint);
  text-transform: uppercase;
  margin-left: var(--sp-2);
  font-weight: 400;
}

/* ---- Note chips — 자주 쓰는 문구 원클릭 추가 ---- */
.note-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
}
.note-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  background: transparent;
  color: var(--fg-mute);
  border: var(--line-1) dashed var(--line-soft);
  border-radius: var(--radius-cap);
  padding: var(--sp-1) var(--sp-3);
  font-family: var(--ff-body);
  font-size: var(--fz-mono-l);
  cursor: pointer;
  transition: color var(--dur-fast), border-color var(--dur-fast), background var(--dur-fast);
}
.note-chip:hover {
  color: var(--fg);
  border-color: var(--line);
  border-style: solid;
}
.note-chip--active {
  color: var(--accent-fg);
  background: var(--accent);
  border-style: solid;
  border-color: var(--accent);
}
.note-chip--active:hover {
  color: var(--accent-fg);
  background: var(--accent);
  opacity: 0.85;
}
.note-chip--active .note-chip__plus {
  /* 활성 시 + 를 ✓로 보이는 효과: ::before 활용 */
  display: none;
}
.note-chip--active::before {
  content: "✓";
  font-family: var(--ff-mono);
  font-weight: 500;
  margin-right: var(--sp-1);
}
.note-chip__plus {
  font-family: var(--ff-mono);
  font-weight: 500;
  opacity: 0.7;
}

/* ---- Inputs ---- */
.input {
  background: var(--bg-input);
  border: var(--line-1) solid var(--line-soft);
  border-radius: var(--radius-md);
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--fz-body);
  font-family: var(--ff-body);
  color: var(--fg);
  width: 100%;
  outline: none;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.input:focus {
  border-color: var(--fg);
  background: var(--bg-input-focus);
}
.input:disabled {
  background: var(--bg);
  color: var(--fg-faint);
  border-style: dashed;
  border-color: var(--line-soft);
}

/* type=date 전용 — 브라우저 기본 스타일 정규화 */
.input-date {
  font-family: var(--ff-mono);
  letter-spacing: 0;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  min-height: 38px;
}
.input-date::-webkit-date-and-time-value { text-align: left; }

/* 캘린더 아이콘 - 다크모드 가시성 */
.input-date::-webkit-calendar-picker-indicator {
  cursor: pointer;
  opacity: 0.7;
  transition: opacity var(--dur-fast);
}
:root[data-theme="dark"] .input-date::-webkit-calendar-picker-indicator {
  filter: invert(1);
  opacity: 0.85;
}
.input-date::-webkit-calendar-picker-indicator:hover { opacity: 1; }

/* 빈 상태일 때 input 위에 떠있는 안내 박스 */
.input-date-wrap {
  position: relative;
}
.input-date-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 0 var(--sp-3);
  background: var(--bg-input);
  border-radius: var(--radius-md);
  pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease-out);
  z-index: 1;
}
.input-date-hint__icon {
  font-size: 1rem;
  opacity: 0.7;
}
.input-date-hint__text {
  font-family: var(--ff-body);
  font-size: var(--fz-body);
  color: var(--fg-mute);
}
/* 값이 들어가면 hint 숨김 */
.input-date-wrap.has-value .input-date-hint {
  opacity: 0;
}

textarea.input { resize: none; min-height: 60px; line-height: 1.55; }

/* ---- Layout helpers ---- */
.flex { display: flex; }
.flex-gap2 { display: flex; gap: var(--sp-2); }
.flex-wrap { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.flex-1 { flex: 1; }
.items-center { align-items: center; }
.mt2 { margin-top: var(--sp-2); }

/* ---- Buttons ---- */
.btn {
  border-radius: var(--radius-cap);
  padding: var(--sp-2) var(--sp-4);
  font-size: var(--fz-body);
  font-family: var(--ff-body);
  letter-spacing: 0;
  cursor: pointer;
  font-weight: 500;
  transition: background var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast);
  border: var(--line-1) solid var(--line);
  white-space: nowrap;
  background: transparent;
  color: var(--fg);
}
.btn:active { transform: scale(0.98); }

/* Primary: 진짜 최종 액션 (Generate / Copy) — 솔리드 풀와이드 */
.btn-primary {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
  width: 100%;
  border-radius: var(--radius-md);
  padding: 14px;
  font-size: var(--fz-mono-l);
  font-weight: 500;
}
.btn-primary:hover { opacity: 0.85; }

/* Default: 자주 쓰는 추가/저장 + 활성 토글 — 솔리드 캡슐 */
.btn-default {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
}
.btn-default:hover { opacity: 0.85; }

/* Outline: 비활성 토글 / 보조 액션 — 시각 강도 ↑ (비활성처럼 보이지 않게) */
.btn-outline {
  background: transparent;
  color: var(--fg);
  border-color: var(--line);
}
.btn-outline:hover {
  background: var(--fg);
  color: var(--bg);
  border-color: var(--fg);
}

/* Ghost: 카테고리 안의 작은 비선택 버튼 — 가장 옅음 */
.btn-ghost {
  background: transparent;
  color: var(--fg-mute);
  border-color: var(--line-soft);
}
.btn-ghost:hover {
  color: var(--fg);
  border-color: var(--line);
}

.btn-sm { padding: var(--sp-1) var(--sp-3); font-size: var(--fz-mono-l); }
.btn-full { width: 100%; border-radius: var(--radius-md); padding: 12px; font-size: var(--fz-mono-l); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---- Section header — 한글 메인 + 번호/영문 보조 ---- */
.section-header {
  border-top: var(--line-1) solid var(--line-soft);
  border-bottom: var(--line-1) solid var(--line-soft);
  padding: var(--sp-3) 0;
  margin-bottom: var(--sp-4);
  display: flex;
  align-items: baseline;
  gap: var(--sp-3);
}
.section-header__num {
  font-family: var(--ff-display);
  font-weight: 900;
  font-size: 1.5rem;
  line-height: 1;
  color: var(--fg-faint);
}
.section-header__title {
  font-family: var(--ff-body);
  font-weight: 700;
  font-size: 1.0625rem;
  letter-spacing: -0.01em;
  color: var(--fg);
  flex: 1;
}
.section-header__sub {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-s);
  letter-spacing: var(--ls-mono);
  color: var(--fg-faint);
  text-transform: uppercase;
}

/* Deadline 섹션 헤더 — 액센트 강조 */
.section-header-blue {
  border-top: var(--line-1) solid var(--line);
  border-bottom: var(--line-1) solid var(--line);
  padding: var(--sp-3) 0;
  margin-bottom: var(--sp-4);
}
.section-header-blue h3 {
  font-family: var(--ff-body);
  font-weight: 700;
  font-size: 1.0625rem;
  letter-spacing: -0.01em;
  color: var(--fg);
}
.section-header-blue p {
  font-family: var(--ff-body);
  font-size: var(--fz-body);
  color: var(--fg-mute);
  margin-top: 4px;
}

/* ---- Category box ---- */
.cat-box {
  border: var(--line-1) solid var(--line-soft);
  border-radius: var(--radius-md);
  padding: var(--sp-3);
  background: transparent;
  margin-bottom: var(--sp-3);
}
.cat-title {
  font-family: var(--ff-body);
  font-weight: 600;
  font-size: var(--fz-body);
  color: var(--fg);
  padding-bottom: var(--sp-2);
  margin-bottom: var(--sp-3);
  border-bottom: var(--line-1) solid var(--line-soft);
}

/* ---- Site tag (캡슐) ---- */
.site-tag {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  border: var(--line-1) solid var(--line);
  border-radius: var(--radius-cap);
  padding: var(--sp-1) var(--sp-3);
  font-family: var(--ff-body);
  font-size: var(--fz-body);
  color: var(--fg);
}
.site-tag-name { cursor: pointer; }
.site-del-btn {
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-family: var(--ff-body);
  font-size: var(--fz-mono-l);
  padding: 2px 6px;
  border-radius: var(--radius-md);
}
.site-del-btn:hover { color: var(--fg); background: var(--bg-input); }
/* 현장관리(허브) 연동 현장 배지 — 삭제 버튼 자리 */
.site-tag-hub {
  color: var(--fg-mute, var(--fg));
  opacity: .65;
  font-size: var(--fz-mono-l);
  padding: 2px 6px;
  border: var(--line-1) solid var(--line);
  border-radius: var(--radius-cap);
}

/* ---- Checkbox ---- */
.checkbox-wrap {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.checkbox-wrap input[type=checkbox] {
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: var(--accent);
}
.checkbox-wrap label {
  font-family: var(--ff-body);
  font-weight: 500;
  font-size: var(--fz-body);
  color: var(--fg);
  cursor: pointer;
}

/* ---- Schedule item — solid 보더, 셀 가시성 ↑ ---- */
.schedule-item {
  display: flex;
  align-items: center;
  padding: var(--sp-2) var(--sp-3);
  background: var(--bg-input);
  border: var(--line-1) solid var(--line-soft);
  border-radius: var(--radius-md);
  gap: var(--sp-2);
  transition: border-color var(--dur-base) var(--ease-out);
}
.schedule-item:focus-within { border-color: var(--line); }
.schedule-item .input {
  font-family: var(--ff-body);
  font-size: var(--fz-body);
  padding: var(--sp-1) var(--sp-2);
  background: transparent;
  border-color: transparent;
}
.schedule-item .input:focus {
  border-color: var(--line);
  background: var(--bg-input-focus);
}
.schedule-item-date {
  width: 130px;
  text-align: left;
  font-family: var(--ff-mono) !important;
  font-weight: 500;
  color: var(--fg) !important;
  cursor: pointer;
  padding: var(--sp-1) var(--sp-2) !important;
}
.schedule-item-day {
  font-family: var(--ff-mono);
  color: var(--fg-mute);
  font-size: var(--fz-mono-m);
  letter-spacing: var(--ls-mono);
  white-space: nowrap;
  width: 32px;
  text-align: center;
}
.schedule-item-work { flex: 1; min-width: 0; }

.del-btn {
  background: transparent;
  color: var(--danger);
  border: var(--line-1) solid var(--line-soft);
  border-radius: var(--radius-cap);
  font-family: var(--ff-body);
  font-size: var(--fz-mono-l);
  padding: 3px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.del-btn:hover { color: var(--fg); border-color: var(--danger); }

/* ---- Empty msg ---- */
.empty-msg {
  font-family: var(--ff-body);
  font-size: var(--fz-body);
  color: var(--fg-faint);
  text-align: center;
  padding: var(--sp-4) 0;
}

/* ---- Template ---- */
.template-box {
  border: var(--line-1) dashed var(--line-soft);
  border-radius: var(--radius-md);
  padding: var(--sp-3);
  background: transparent;
  margin-bottom: var(--sp-3);
}
.template-box h4 {
  font-family: var(--ff-body);
  font-weight: 600;
  font-size: var(--fz-body);
  color: var(--fg);
  margin-bottom: var(--sp-3);
}
.template-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--sp-2) var(--sp-3);
  background: transparent;
  border-radius: var(--radius-md);
  border: var(--line-1) solid var(--line-soft);
  margin-bottom: var(--sp-2);
  font-family: var(--ff-body);
  font-size: var(--fz-body);
  gap: var(--sp-2);
}
.template-load-btn {
  background: transparent;
  border: var(--line-1) solid var(--line);
  border-radius: var(--radius-cap);
  color: var(--fg);
  font-family: var(--ff-body);
  font-size: var(--fz-mono-l);
  padding: 3px 12px;
  cursor: pointer;
}
.template-load-btn:hover { background: var(--fg); color: var(--bg); }

/* ---- Result ---- */
.result-box {
  white-space: pre-wrap;
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-l);
  line-height: 1.7;
  margin-bottom: var(--sp-3);
  color: var(--fg);
  letter-spacing: 0;
}
.result-box:lang(ko) { font-family: var(--ff-body); }

/* ---- Auto date — 핵심 정보로 부각 ---- */
.auto-date-wrap {
  display: flex;
  align-items: baseline;
  gap: var(--sp-3);
  padding: var(--sp-3);
  background: var(--bg-input);
  border: var(--line-1) solid var(--line-soft);
  border-radius: var(--radius-md);
  margin-bottom: var(--sp-3);
}
.auto-date-label {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-s);
  letter-spacing: var(--ls-mono);
  color: var(--fg-faint);
  text-transform: uppercase;
  white-space: nowrap;
}
.auto-date {
  font-family: var(--ff-display);
  color: var(--fg);
  font-weight: 900;
  font-size: 1.5rem;
  letter-spacing: -0.01em;
  line-height: 1;
  flex: 1;
}

/* ---- Hint ---- */
.hint {
  font-family: var(--ff-body);
  font-size: var(--fz-mono-l);
  color: var(--fg-faint);
  margin-bottom: var(--sp-2);
}

/* ---- Toast ---- */
#toast {
  display: none;
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: var(--accent-fg);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius-cap);
  font-family: var(--ff-body);
  font-size: var(--fz-body);
  font-weight: 500;
  z-index: 1000;
}

/* ---- Scroll ---- */
.scroll-40 { max-height: 160px; overflow-y: auto; }
.scroll-60 { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: var(--sp-2); }
.space-y2 { display: flex; flex-direction: column; gap: var(--sp-2); }

/* ---- Footer ---- */
.footer {
  border-top: var(--line-1) dashed var(--line-soft);
  margin-top: var(--sp-8);
  padding-top: var(--sp-4);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sp-3);
  flex-wrap: wrap;
}
.footer span {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-s);
  letter-spacing: var(--ls-mono);
  color: var(--fg-faint);
  text-transform: uppercase;
}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">다크 / 01</button>

<div class="wrap">

  <!-- HERO -->
  <header class="hero">
    <h1 class="hero__title">SITE<br>REPORT</h1>
    <div class="hero__meta">
      <span>공사보고 자동화</span>
      <span>v2.0</span>
      <span>© 2026 IGGG STUDIO</span>
    </div>
  </header>

  <div class="card">
    <div class="card-content">

      <!-- 현장명 -->
      <div>
        <label class="label">현장명 <span class="label__sub">01 · Site</span></label>
        <div class="flex-gap2">
          <input class="input flex-1" id="siteInput" placeholder="예: 이견공간 뉴욕점" onkeydown="if(event.key==='Enter')addSite()">
          <button class="btn btn-default" onclick="addSite()">추가</button>
        </div>
        <div class="flex-wrap mt2" id="siteList"></div>
        <p id="hubSyncStatus" class="label__sub" style="display:block;margin:6px 0 0"></p>
      </div>

      <!-- 오늘 작업 공정 -->
      <div>
        <div class="section-header">
          <span class="section-header__num">02</span>
          <span class="section-header__title">오늘 작업 공정</span>
          <span class="section-header__sub">Today</span>
        </div>
        <div class="flex-gap2" style="margin-bottom:12px">
          <button class="btn btn-default" id="tab-오늘" onclick="setTodayType('오늘')">오늘</button>
          <button class="btn btn-outline" id="tab-오늘까지" onclick="setTodayType('오늘까지')">오늘까지</button>
        </div>
        <div id="todayCats"></div>
      </div>

      <!-- 다음 작업 일정 -->
      <div>
        <label class="label">다음 작업 일정 <span class="label__sub">Next</span></label>
        <div class="flex-gap2" style="flex-wrap:wrap">
          <button class="btn btn-default" id="tab-내일" onclick="setNextType('내일')">내일</button>
          <button class="btn btn-outline" id="tab-월요일" onclick="setNextType('월요일')">월요일</button>
          <button class="btn btn-outline" id="tab-날짜선택" onclick="pickNextDate()">
            <span id="tab-날짜선택__label">📅 날짜선택</span>
          </button>
          <input type="date" id="nextDateInput" onchange="onNextDateChange(this.value)" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0">
        </div>
      </div>

      <!-- 내일 작업 공정 -->
      <div>
        <div class="section-header">
          <span class="section-header__num">03</span>
          <span class="section-header__title" id="nextHeader">내일 작업 공정</span>
          <span class="section-header__sub">Next</span>
        </div>
        <div id="nextCats"></div>
      </div>

      <!-- 특이사항 -->
      <div>
        <label class="label">특이사항 <span class="label__sub">Notes</span></label>
        <div class="note-chips" id="noteChips"></div>
        <textarea class="input" id="note" placeholder="없음 또는 특이사항 메모" oninput="onNoteInput()">금일 특이사항 없습니다.</textarea>
      </div>

      <!-- 공사마감 임박 -->
      <div class="checkbox-wrap">
        <input type="checkbox" id="deadlineCheck" onchange="toggleDeadline()">
        <label for="deadlineCheck">공사마감 1주일 전 (남은 일정 안내 표시)</label>
      </div>

      <!-- 남은 일정 -->
      <div id="scheduleSection" style="display:none">
        <div class="section-header-blue">
          <h3>남은 일정 안내</h3>
          <p id="scheduleSubtitle">오늘 기준으로 자동으로 날짜가 생성됩니다</p>
        </div>

        <!-- 현장별 관리 -->
        <div class="template-box">
          <h4>현장별 템플릿 <span class="label__sub">04 · Templates</span></h4>
          <div class="flex-gap2" style="margin-bottom:8px">
            <input class="input flex-1" id="templateSiteName" disabled>
            <button class="btn btn-default" id="saveTemplateBtn" onclick="saveTemplate()">저장</button>
          </div>
          <div class="scroll-40 space-y2" id="templateList">
            <p class="empty-msg">저장된 템플릿이 없습니다</p>
          </div>
        </div>

        <!-- 일정 추가 -->
        <div style="margin-bottom:8px">
          <div class="auto-date-wrap">
            <span class="auto-date-label">자동 날짜</span>
            <div class="auto-date" id="autoDate"></div>
          </div>
          <p class="hint">날짜를 바꾸려면 아래에서 직접 선택 (비우면 자동 날짜로 추가)</p>
          <div class="input-date-wrap" id="customDateWrap" style="margin-bottom:6px">
            <input class="input input-date" id="customDate" type="date" onchange="syncCustomDate()">
            <div class="input-date-hint" id="customDateHint">
              <span class="input-date-hint__icon">📅</span>
              <span class="input-date-hint__text">탭하여 달력에서 날짜 선택</span>
            </div>
          </div>
          <div class="flex-gap2">
            <input class="input flex-1" id="scheduleWork" placeholder="작업 (예: 타일)" onkeydown="if(event.key==='Enter')addSchedule()">
            <button class="btn btn-default" onclick="addSchedule()">추가</button>
          </div>
        </div>

        <!-- 일정 목록 -->
        <div class="scroll-60" id="scheduleList">
          <p class="empty-msg">남은 일정이 없습니다</p>
        </div>
      </div>

      <!-- 보고서 생성 -->
      <button class="btn btn-primary" onclick="generate()">보고서 생성</button>

    </div>
  </div>

  <!-- 결과 -->
  <div class="card" id="resultCard" style="display:none">
    <div class="card-content">
      <div class="section-header">
        <span class="section-header__num">05</span>
        <span class="section-header__title">보고서 결과</span>
        <span class="section-header__sub">Output</span>
      </div>
      <div class="result-box" id="resultBox"></div>
      <button class="btn btn-primary" onclick="copyResult()">보고서 복사</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>이견공간 · IGGG STUDIO</span>
    <span>Seoul, Korea</span>
    <span>©2026</span>
  </footer>

</div>
<div id="toast"></div>

<script>
/* =========================================================
   Theme toggle
   ========================================================= */
function toggleTheme() {
  const root = document.documentElement;
  const cur = root.dataset.theme || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  localStorage.setItem('iggg-theme', next);
  document.getElementById('themeToggle').textContent = next === 'dark' ? '다크 / 01' : '라이트 / 02';
}
(function initTheme(){
  const saved = localStorage.getItem('iggg-theme');
  const sys = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  const t = saved || sys;
  document.documentElement.dataset.theme = t;
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = t === 'dark' ? '다크 / 01' : '라이트 / 02';
  });
})();


/* =========================================================
   App logic — 원본 100% 유지
   ========================================================= */

// ── 데이터 ──
const CATS = {
  '기초': ['철거','자재 입고','가설','보양','폐기물처리','현장 정리'],
  '본공사': ['목공','전기','금속','설비','방통','양생','도장','필름','타일','덕트','경량','내외부마감','준공 청소','도배','데코타일','바닥마루','아트미장','바닥마감','화장실마감','도기설치','외부 데크'],
  '외주': ['에어컨','간판','주방 입고','가스','온수기 설치','의탁자 입고','CCTV','소방','인터넷','폴딩도어','덤웨이터','블라인드']
}
const 요일목록 = ['일','월','화','수','목','금','토']

// ── 상태 ──
let 현장명 = ''
let 현장목록 = []
let 오늘공정 = []
let 내일공정 = []
let todayType = '오늘'
let nextType = '내일'
let nextCustomDate = ''   // 날짜선택 사용 시 "M/D" 형식 저장
let 마감임박 = false
let 남은일정 = []
let 현장별일정 = {}
let 템플릿목록 = {}

// ── localStorage ──
function loadStorage() {
  try {
    현장명 = localStorage.getItem('현장명') || ''
    현장목록 = JSON.parse(localStorage.getItem('현장목록') || '[]')
    마감임박 = JSON.parse(localStorage.getItem('공사마감임박') || 'false')
    현장별일정 = JSON.parse(localStorage.getItem('현장별남은일정') || '{}')
    템플릿목록 = JSON.parse(localStorage.getItem('템플릿목록') || '{}')
    if (현장명 && 현장별일정[현장명]) 남은일정 = 현장별일정[현장명]
  } catch(e) {}
}
function saveStorage() {
  localStorage.setItem('현장명', 현장명)
  localStorage.setItem('현장목록', JSON.stringify(현장목록))
  localStorage.setItem('공사마감임박', JSON.stringify(마감임박))
  localStorage.setItem('현장별남은일정', JSON.stringify(현장별일정))
  localStorage.setItem('템플릿목록', JSON.stringify(템플릿목록))
}

// ── 특이사항 칩 ──
const NOTE_CHIPS = [
  '인터넷·CCTV·보안은 사전 협의가 필요한 공정입니다. 업체 선정 후 연락처 전달 주시면 일정에 차질 없도록 협의해 드리겠습니다 :)'
]

// 칩이 textarea에 "있는지" 판단 - 정확/유사 모두 검사
function isChipActive(chipText, taValue) {
  if (!taValue) return false
  // 1. 정확 일치 (가장 흔한 케이스)
  if (taValue.includes(chipText)) return true
  // 2. 핵심 키워드 (앞 15자) 라인이 존재하는지
  const key = chipText.slice(0, 15)
  return taValue.includes(key)
}

// 칩 텍스트(또는 핵심 키워드 포함 라인)를 textarea에서 제거
function removeChipText(chipText, taValue) {
  // 1. 정확 일치 우선
  if (taValue.includes(chipText)) {
    let next = taValue.replace(chipText, '')
    // 칩 앞뒤 줄바꿈 정리
    next = next.replace(/\n{3,}/g, '\n\n').replace(/^\n+|\n+$/g, '')
    return next
  }
  // 2. 부분 일치 — 핵심 키워드 포함된 라인을 통째로 제거
  const key = chipText.slice(0, 15)
  const lines = taValue.split('\n')
  const filtered = lines.filter(line => !line.includes(key))
  return filtered.join('\n').replace(/^\n+|\n+$/g, '')
}

function renderNoteChips() {
  const el = document.getElementById('noteChips')
  if (!el) return
  if (!NOTE_CHIPS.length) { el.innerHTML = ''; return }
  const taValue = (document.getElementById('note')?.value || '')
  el.innerHTML = NOTE_CHIPS.map((txt, i) => {
    const active = isChipActive(txt, taValue)
    const dotIdx = txt.indexOf('.')
    const short = dotIdx > 0 && dotIdx < 40 ? txt.slice(0, dotIdx) : (txt.length > 30 ? txt.slice(0, 30) + '…' : txt)
    return `<button class="note-chip ${active ? 'note-chip--active' : ''}" onclick="toggleNoteChip(${i})">
      <span class="note-chip__plus">+</span>
      <span>${short}</span>
    </button>`
  }).join('')
}

function toggleNoteChip(idx) {
  const txt = NOTE_CHIPS[idx]
  if (!txt) return
  const ta = document.getElementById('note')
  const cur = ta.value
  const active = isChipActive(txt, cur)

  if (active) {
    // 제거
    let next = removeChipText(txt, cur)
    // 비어있으면 기본 문구로 복원
    if (!next.trim()) next = '금일 특이사항 없습니다.'
    ta.value = next
    showToast('특이사항에서 제거되었습니다.')
  } else {
    // 추가 - 기본 문구만 있거나 비어있으면 교체
    const trimmed = cur.trim()
    const isDefault = !trimmed || trimmed === '금일 특이사항 없습니다.'
    ta.value = isDefault ? txt : (cur.replace(/\s+$/, '') + '\n' + txt)
    showToast('특이사항에 추가되었습니다.')
  }
  renderNoteChips()
}

// textarea 직접 수정 시 칩 상태 자동 갱신
function onNoteInput() {
  renderNoteChips()
  hubQueueSave()
}

// ── 토스트 ──
let toastTimer
function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.style.display = 'block'
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.style.display = 'none', 2000)
}

// ── 현장명 ──
function addSite() {
  const val = document.getElementById('siteInput').value.trim()
  if (!val) return showToast('현장명을 입력해주세요.')
  if (현장목록.includes(val)) return showToast('이미 있는 현장입니다.')
  현장목록.unshift(val)
  현장명 = val
  document.getElementById('siteInput').value = ''
  saveStorage()
  renderSites()
  syncScheduleToSite()
  showToast('현장명이 추가되었습니다.')
}
function selectSite(name) {
  현장명 = name
  document.getElementById('siteInput').value = name
  남은일정 = 현장별일정[현장명] ? [...현장별일정[현장명]] : []
  saveStorage()
  renderSites()
  renderScheduleList()
  updateAutoDate()
  updateScheduleSubtitle()
  if (document.getElementById('templateSiteName'))
    document.getElementById('templateSiteName').value = 현장명
  // 현장관리 연동 현장이면 오늘 로그를 불러온다(fail-open)
  if (허브현장[name]) hubLoadLog(name)
  else hubSetStatus('')
}
function deleteSite(name) {
  if (허브현장[name]) return showToast('현장관리 연동 현장은 현장관리에서 관리합니다.')
  delete 현장별일정[name]
  현장목록 = 현장목록.filter(x => x !== name)
  if (현장명 === name) { 현장명 = ''; 남은일정 = [] }
  saveStorage()
  renderSites()
  renderScheduleList()
  showToast('현장명이 삭제되었습니다.')
}
function renderSites() {
  const el = document.getElementById('siteList')
  if (!현장목록.length) { el.innerHTML = ''; return }
  // 현장관리(허브) 유입 현장 = 배지 표시 + 삭제 없음(삭제는 현장관리에서)
  el.innerHTML = 현장목록.map(h => `
    <div class="site-tag">
      <span class="site-tag-name" onclick="selectSite('${escAttrJs(h)}')">${escHtml(h)}</span>
      ${허브현장[h]
        ? '<span class="site-tag-hub" title="현장관리(site.igggstudio.com) 연동 현장">관리</span>'
        : `<button class="site-del-btn" onclick="deleteSite('${escAttrJs(h)}')">삭제</button>`}
    </div>
  `).join('')
}

// ── 카테고리 ──
function renderCats(containerId, checkedArr, toggleFn) {
  const el = document.getElementById(containerId)
  el.innerHTML = Object.entries(CATS).map(([cat, items]) => `
    <div class="cat-box">
      <p class="cat-title">${cat}</p>
      <div class="flex-wrap">
        ${items.map(item => `
          <button class="btn btn-sm ${checkedArr.includes(item) ? 'btn-default' : 'btn-ghost'}"
            onclick="${toggleFn}('${item.replace(/'/g,"\\'")}')">${item}</button>
        `).join('')}
      </div>
    </div>
  `).join('')
}
function toggleToday(item) {
  오늘공정 = 오늘공정.includes(item) ? 오늘공정.filter(x=>x!==item) : [...오늘공정, item]
  renderCats('todayCats', 오늘공정, 'toggleToday')
  hubQueueSave()
}
function toggleNext(item) {
  내일공정 = 내일공정.includes(item) ? 내일공정.filter(x=>x!==item) : [...내일공정, item]
  renderCats('nextCats', 내일공정, 'toggleNext')
  hubQueueSave()
}

// ── 오늘/오늘까지 ──
function setTodayType(type) {
  todayType = type
  document.getElementById('tab-오늘').className = 'btn ' + (type==='오늘' ? 'btn-default' : 'btn-outline')
  document.getElementById('tab-오늘까지').className = 'btn ' + (type==='오늘까지' ? 'btn-default' : 'btn-outline')
}

// ── 내일/월요일 ──
function setNextType(type) {
  nextType = type
  // 3-way 탭 활성/비활성 처리
  document.getElementById('tab-내일').className = 'btn ' + (type==='내일' ? 'btn-default' : 'btn-outline')
  document.getElementById('tab-월요일').className = 'btn ' + (type==='월요일' ? 'btn-default' : 'btn-outline')
  document.getElementById('tab-날짜선택').className = 'btn ' + (type==='날짜선택' ? 'btn-default' : 'btn-outline')

  // 헤더 텍스트
  if (type === '날짜선택' && nextCustomDate) {
    document.getElementById('nextHeader').textContent = nextCustomDate + ' 작업 공정'
  } else if (type === '날짜선택') {
    document.getElementById('nextHeader').textContent = '날짜 선택 작업 공정'
  } else {
    document.getElementById('nextHeader').textContent = type + ' 작업 공정'
  }
}

// 날짜선택 버튼 클릭 - hidden date input의 picker 트리거
function pickNextDate() {
  const input = document.getElementById('nextDateInput')
  if (!input) return
  // 기존에 선택한 값이 있으면 picker가 그 날짜에서 시작

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}
// 인라인 onclick 의 JS 문자열 인자용 — JS 이스케이프 후 속성(HTML) 이스케이프
function escAttrJs(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')
}

// "2026-05-02" → "5/2"
function isoToMD(iso) {
  const parts = iso.split('-')
  if (parts.length !== 3) return iso
  return `${Number(parts[1])}/${Number(parts[2])}`
}

// "5/2" → "2026-05-02" (현재 연도 기준)
function mdToIso(md) {
  if (!md || !md.includes('/')) return ''
  const [m, d] = md.split('/').map(Number)
  if (!m || !d) return ''
  const y = new Date().getFullYear()
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`
}

function hubToken() {

function hubDateKey(offsetDays) {
  const d = new Date()
  d.setDate(d.getDate() + (offsetDays || 0))
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10)
}
function hubTodayKey() { return hubDateKey(0) }
function hubUnwrap(v) {
  if (!v) return null
  if ('stringValue' in v) return v.stringValue
  if ('integerValue' in v) return Number(v.integerValue)
  if ('doubleValue' in v) return v.doubleValue
  if ('booleanValue' in v) return v.booleanValue
  if ('timestampValue' in v) return v.timestampValue
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(hubUnwrap)
  if ('mapValue' in v) {
    const o = {}
    Object.entries(v.mapValue.fields || {}).forEach(([k, x]) => { o[k] = hubUnwrap(x) })
    return o
  }
  return null
}
function hubStrArr(arr) {
  return { arrayValue: { values: (arr || []).map(s => ({ stringValue: String(s) })) } }

async function hubFetchSites() {
  const token = await hubToken()
  let pageToken = '', out = []
  do {   // pageToken 순회 필수 — 1회 호출은 300건 초과분이 조용히 절단된다(형제 앱 감사 교훈)
    const r = await fetch(HUB_BASE + '/sites?pageSize=300' + (pageToken ? '&pageToken=' + pageToken : ''),
      { headers: { Authorization: 'Bearer ' + token } })
    if (!r.ok) throw new Error('sites ' + r.status)
    const j = await r.json()
    ;(j.documents || []).forEach(doc => {
      const f = doc.fields || {}
      out.push({ id: doc.name.split('/').pop(), name: hubUnwrap(f.name) || '',
                 status: hubUnwrap(f.status) || '', updatedAt: hubUnwrap(f.updatedAt) || '' })
    })
    pageToken = j.nextPageToken || ''
  } while (pageToken)
  return out
}

const SCHED_KEY = 'AIzaSyAks6Jg7KiIOv9rWmAlnXcC8vEnNZvDbDo'   // iggg-schedule 공개 웹키(허브 schedule.js 동일)
const SCHED_BASE = 'https://firestore.googleapis.com/v1/projects/iggg-schedule/databases/(default)/documents'
/* iggg_sso 쿠키(.igggstudio.com 공용, {email, refreshToken}) — ig works 로그인이 심는다. */
function ssoRefreshToken() {
  try {
    const m = document.cookie.match(/(?:^|; )iggg_sso=([^;]*)/)
    if (!m) return ''
    return (JSON.parse(decodeURIComponent(m[1]) || 'null') || {}).refreshToken || ''
  } catch (e) { return '' }
}
/* 실직원 신원 토큰(보안 웨이브 2, 2026-07-28) — refreshToken → id_token 교환.
   실패는 던지지 않고 null 로 알린다(호출부가 익명으로 폴백). */
async function schedStaffToken() {
  try {
    const rt = ssoRefreshToken()
    if (!rt) throw new Error('iggg_sso 쿠키 없음')
    const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + SCHED_KEY, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(rt),
    })
    if (!r.ok) throw new Error('securetoken ' + r.status)
    const j = await r.json()
    if (!j.id_token) throw new Error('id_token 없음')
    return j.id_token
  } catch (e) {
    console.warn('[sched] 직원 인증 실패 — 익명 폴백:', (e && e.message) || e)
    return null
  }
}
let schedTokenP = null
function schedToken() {
  if (schedTokenP) return schedTokenP
  /* 전환기 폴백: 규칙 잠금 전까지 익명으로도 읽히고, 잠근 뒤엔 폴백이 자연 실패한다. */
  schedTokenP = schedStaffToken()
    .then(t => t || fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + SCHED_KEY, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ returnSecureToken: true })
    }).then(r => { if (!r.ok) throw new Error('sched auth ' + r.status); return r.json() })
      .then(j => j.idToken))
    .catch(e => { schedTokenP = null; throw e })
  return schedTokenP
}
async function hubFetchSched(pn) {
  const t = await schedToken()
  const r = await fetch(SCHED_BASE + ':runQuery', {
    method: 'POST', headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' },
    body: JSON.stringify({ structuredQuery: {
      from: [{ collectionId: 'sites' }],
      where: { fieldFilter: { field: { fieldPath: 'pn' }, op: 'EQUAL', value: { stringValue: pn } } },
      limit: 1,
    } }),
  })
  if (!r.ok) return null
  const doc = ((await r.json()) || []).map(x => x.document).filter(Boolean)[0]
  if (!doc) return null
  return (hubUnwrap((doc.fields || {}).tasks) || [])
}
function hubTasksOn(tasks, day) {   // 허브 tasksOn 동형(분할 구간 포함)
  const within = (a, b) => a && b && a <= day && day <= b
  return (tasks || [])
    .filter(t => t && t.on !== false && (within(t.sd, t.ed) || (t.split === true && within(t.sd2, t.ed2))))
    .map(t => String(t.name || '')).filter(Boolean)
}
async function hubSeedSuggest(name, id, token) {
  let note = ''
  try {
    // ① 직전 로그의 내일 예정 → 오늘 공정
    const lr = await fetch(HUB_BASE + '/sites/' + encodeURIComponent(id) + '/logs?pageSize=300',
      { headers: { Authorization: 'Bearer ' + token } })
    if (lr.ok) {
      const docs = (await lr.json()).documents || []
      const todayKey = hubTodayKey()
      let prev = null
      docs.forEach(d => {
        const f = d.fields || {}
        const dt = String(hubUnwrap(f.date) || d.name.split('/').pop())
        if (dt < todayKey && (!prev || dt > prev.dt)) prev = { dt, f }
      })
      const tw = prev ? (hubUnwrap(prev.f.tomorrowWork) || []).filter(Boolean).map(String) : []
      if (tw.length) { 오늘공정 = tw; note = prev.dt.replace(/-/g, '.') + ' 내일예정' }
    }
    // ② 공사일정표 — 오늘(①이 비었을 때)·내일 보충
    let tasks = null
    try { tasks = await hubFetchSched(name) } catch (e) { /* 일정표 미연동 현장 — 무시 */ }
    if (tasks) {
      if (!오늘공정.length) { const t = hubTasksOn(tasks, hubTodayKey()); if (t.length) { 오늘공정 = t; note = '공사일정표' } }
      const tm = hubTasksOn(tasks, hubDateKey(1))
      if (tm.length) 내일공정 = tm
    }
    if (현장명 !== name) return
    renderCats('todayCats', 오늘공정, 'toggleToday')
    renderCats('nextCats', 내일공정, 'toggleNext')
    hubSetStatus('현장관리 연동됨 · 오늘 기록 없음'
      + (note ? ' · ' + note + ' 자동 채움(수정하세요)' : '(작성하면 생성)'))
  } catch (e) {
    hubSetStatus('현장관리 연동됨 · 오늘 기록 없음(작성하면 생성)')
  }
}

function hubQueueSave() {
  if (!현장명 || !허브현장[현장명]) return
  clearTimeout(hubSaveTimer)
  hubSaveTimer = setTimeout(() => hubSaveLog().catch(() => {}), 1500)
}

async function hubSaveLog(stampField) {
  const id = 허브현장[현장명]
  if (!id) return
  clearTimeout(hubSaveTimer)
  const token = await hubToken()
  const fieldNames = ['date', 'todayWork', 'tomorrowWork', 'note', 'remainOn', 'remaining', 'updatedAt']
  if (stampField) fieldNames.push(stampField)
  const url = HUB_BASE + '/sites/' + encodeURIComponent(id) + '/logs/' + hubTodayKey() +
    '?' + fieldNames.map(f => 'updateMask.fieldPaths=' + f).join('&')
  const nowIso = new Date().toISOString()
  const body = { fields: {
    date: { stringValue: hubTodayKey() },
    todayWork: hubStrArr(오늘공정),
    tomorrowWork: hubStrArr(내일공정),
    note: { stringValue: (document.getElementById('note').value || '').trim() },
    remainOn: { booleanValue: !!마감임박 },
    remaining: { arrayValue: { values: (남은일정 || []).filter(x => x.작업).map(x => ({
      mapValue: { fields: { date: { stringValue: mdToIso(x.날짜) },
                            work: { stringValue: String(x.작업) } } }
    })) } },
    updatedAt: { timestampValue: nowIso },
  } }
  if (stampField) body.fields[stampField] = { stringValue: nowIso }
  hubSetStatus('현장관리 저장 중…')
  const r = await fetch(url, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(body),
  })
  if (!r.ok) { hubSetStatus('현장관리 저장 실패 — 로컬은 유지됨'); throw new Error('save ' + r.status) }
  hubSetStatus('현장관리 연동됨 · 저장됨 ✓'
    + (stampField === 'reportDoneAt' ? ' · 보고준비완료' : stampField === 'copiedAt' ? ' · 복사 도장' : ''))
}

function hubStamp(field) {
  if (!현장명 || !허브현장[현장명]) return
  hubSaveLog(field).catch(() => {})
}

// ── 초기화 ──
loadStorage()
renderSites()
renderCats('todayCats', 오늘공정, 'toggleToday')
renderCats('nextCats', 내일공정, 'toggleNext')
renderScheduleList()
renderTemplates()
renderNoteChips()
updateAutoDate()
hubInit()

if (마감임박) {
  document.getElementById('deadlineCheck').checked = true
  document.getElementById('scheduleSection').style.display = 'block'
}
if (현장명) {
  document.getElementById('siteInput').value = 현장명
  if (document.getElementById('templateSiteName'))
    document.getElementById('templateSiteName').value = 현장명
}
</script>
